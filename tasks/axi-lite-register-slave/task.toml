[task]
name = "adzzat/axi-lite-register-slave"
description = "Fix an AXI-Lite-style write slave's premature bvalid deassertion so it correctly holds VALID until READY, verified by cycle-accurate Icarus Verilog / cocotb simulation against an independent reference model."
keywords = ["chip-design", "verilog", "axi", "bus-protocol", "digital-design"]
